name: shiller_cape

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas xlrd
      - run: python scripts/fetch_shiller_cape.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/shiller_cape.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/shiller_cape.json
            git commit -m "update shiller_cape.json"
            git push
          else
            echo "no change"
          fi
