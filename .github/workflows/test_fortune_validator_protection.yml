   # rerun
   name: Fortune Validator Protection Tests (Isolated)

   on:
     push:
       branches:
         - test/fortune-null-fill-20261027
       paths:
         - .github/workflows/test_fortune_validator_protection.yml
         - scripts/validate_fortune.py
         - scripts/test_validate_fortune_protection.py

   permissions:
     contents: read

   concurrency:
     group: fortune-validator-protection-tests
     cancel-in-progress: false

   jobs:
     protection-tests:
       runs-on: ubuntu-latest
       env:
         APPROVED_VALIDATOR_COMMIT: 23be712d4ce8c93350fbe0dcb2e0dca42a01b0e0
       steps:
         - name: Checkout test branch
           uses: actions/checkout@v4
           with:
             fetch-depth: 0

         - name: Verify main validator blob before tests
           shell: bash
           run: |
             set -euo pipefail
             git fetch origin main --no-tags
             echo "main SHA before tests (info only): $(git rev-parse origin/main)"
             approved="$(git rev-parse "${APPROVED_VALIDATOR_COMMIT}:scripts/validate_fortune.py")"
             actual="$(git rev-parse origin/main:scripts/validate_fortune.py)"
             echo "approved validator blob: $approved"
             echo "main validator blob before tests: $actual"
             if [[ "$actual" != "$approved" ]]; then
               echo "ERROR: main validate_fortune.py differs from the approved baseline; tests aborted."
               exit 1
             fi

         - name: Set up Python
           uses: actions/setup-python@v5
           with:
             python-version: "3.12"

         - name: Compile candidate and dedicated tests
           run: python -m py_compile scripts/validate_fortune.py scripts/test_validate_fortune_protection.py

         - name: Run isolated protection tests
           run: python scripts/test_validate_fortune_protection.py

         - name: Verify main validator blob after tests
           if: always()
           shell: bash
           run: |
             set -euo pipefail
             git fetch origin main --no-tags
             echo "main SHA after tests (info only): $(git rev-parse origin/main)"
             approved="$(git rev-parse "${APPROVED_VALIDATOR_COMMIT}:scripts/validate_fortune.py")"
             actual="$(git rev-parse origin/main:scripts/validate_fortune.py)"
             echo "main validator blob after tests: $actual"
             if [[ "$actual" != "$approved" ]]; then
               echo "ERROR: main validate_fortune.py changed during tests."
               exit 1
             fi
