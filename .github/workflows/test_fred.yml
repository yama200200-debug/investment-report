name: Test FRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/test_fred.py
