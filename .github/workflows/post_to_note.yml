name: Post to Note

on:
  push:
    branches:
      - main
    paths:
      - 'investment_report_*.html'
  schedule:
    - cron: '0 22 * * *'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get changed HTML file
        id: changed
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD | grep -E 'investment_report_[0-9]{8}\.html' | head -1)
          if [ -z "$FILE" ]; then
            FILE=$(ls investment_report_*.html 2>/dev/null | grep -E 'investment_report_[0-9]{8}\.html' | sort | tail -1)
          fi
          if [ -z "$FILE" ]; then
            echo "対象の日付付きレポートファイルが見つかりませんでした" >&2
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post to Note
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          HTML_FILE: ${{ steps.changed.outputs.file }}
          GITHUB_PAGES_BASE: https://yama200200-debug.github.io/investment-report/
        run: python post_to_note.py
