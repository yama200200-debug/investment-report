name: Generate Astro Events

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-astro-events
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ephem
        run: pip install ephem==4.2.1

      - name: Generate astro events
        run: python scripts/generate_astro_events.py 2015 2027

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-data/fortune/fortune_records.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "update fortune_records.json (astro events)"
            git push
          fi
