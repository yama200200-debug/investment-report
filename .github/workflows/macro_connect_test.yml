name: macro_connect_test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test 4 sources
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          ua = os.environ.get("SEC_USER_AGENT", "")
          targets = [
              ("MOEA", "https://service.moea.gov.tw/EE520/opendata/b.csv", {"User-Agent": "Mozilla/5.0"}),
              ("TWSE", "https://openapi.twse.com.tw/v1/opendata/t187ap05_L", {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}),
              ("SEC", "https://data.sec.gov/api/xbrl/companyconcept/CIK0000789019/us-gaap/PaymentsToAcquirePropertyPlantAndEquipment.json", {"User-Agent": ua}),
              ("WB", "https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx", {"User-Agent": "Mozilla/5.0"}),
          ]
          for name, url, headers in targets:
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60)
                  n = len(r.read())
                  print(name, "OK", r.status, n, "bytes", round(time.time() - t, 1), "s")
              except Exception as e:
                  print(name, "ERROR", type(e).__name__, str(e)[:120])
          PY
